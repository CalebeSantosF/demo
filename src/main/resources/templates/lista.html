<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Animais</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="topo">
        <div>
            <h1>Cadastro de Animais</h1>
            <p>Animais cadastrados no sistema</p>
        </div>
        <a class="botao" th:href="@{/animais/novo}">+ Novo animal</a>
    </div>

    <div class="vazio" th:if="${#lists.isEmpty(animais)}">
        Nenhum animal cadastrado.
    </div>

    <div class="tabela-wrapper" th:unless="${#lists.isEmpty(animais)}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Espécie</th>
                <th>Raça</th>
                <th>Idade</th>
                <th>Sexo</th>
                <th>Cor</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="animal : ${animais}">
                <td th:text="${animal.id}"></td>
                <td th:text="${animal.nome}"></td>
                <td th:text="${animal.especie}"></td>
                <td th:text="${animal.raca}"></td>
                <td th:text="${animal.idade}"></td>
                <td th:text="${animal.sexo}"></td>
                <td th:text="${animal.cor}"></td>
                <td class="acoes">
                    <a class="editar" th:href="@{/animais/editar/{id}(id=${animal.id})}">Editar</a>
                    <a class="excluir"
                       th:href="@{/animais/excluir/{id}(id=${animal.id})}"
                       onclick="return confirm('Deseja realmente excluir este animal?')">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
